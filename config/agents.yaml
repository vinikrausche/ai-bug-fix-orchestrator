version: 1

project:
  # Relative to this configuration file. Other paths are relative to the repo.
  repository: ..
  documentation:
    - docs/SPECIFICATION.md
    - docs/AGENT_SKILLS.md

agents:
  architect:
    adapter: codex
    model: default
    skills:
      shared:
        - skills/shared/project-context/SKILL.md
      role:
        - skills/architect/bugfix-planning/SKILL.md

  developer:
    adapter: codex
    model: default
    skills:
      shared:
        - skills/shared/project-context/SKILL.md
      role:
        - skills/developer/safe-bugfix/SKILL.md

  reviewer:
    adapter: codex
    model: default
    skills:
      shared:
        - skills/shared/project-context/SKILL.md
      role:
        - skills/reviewer/diff-review/SKILL.md
        - skills/reviewer/test-validation/SKILL.md
